services:
  server2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server-nestjs-2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      - RABBITMQ_URL=${RABBITMQ_DOCKER_URL:-amqp://guest:guest@server-rabbitmq-1:5672}
    ports:
      - "${NEST_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - server2-net
      - spring-backend

  mongodb:
    image: mongo:7
    container_name: server2-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - server2_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh \"mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@localhost:27017/admin\" --quiet --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - server2-net

networks:
  server2-net:
    driver: bridge
  spring-backend:
    external: true
    name: server_backend

volumes:
  server2_mongo_data:
